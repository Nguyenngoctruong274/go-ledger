name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LEDGER_TEST_DATABASE_URL: postgres://ledger:ledger@localhost:5432/ledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet -tags integration ./...
      - name: Test (unit + PostgreSQL + end-to-end)
        run: go test -race -tags integration -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile stack config -q
      - name: Build image
        run: docker build -t go-ledger:ci .
      - name: Smoke test the full stack
        run: |
          docker compose --profile stack up -d --build postgres webhook-sink ledgerd
          for i in $(seq 1 30); do
            curl -fsS localhost:8080/readyz && break
            sleep 2
          done
          curl -fsS -X POST localhost:8080/v1/accounts -d '{"id":"funding","currency":"VND","allow_negative":true}'
          curl -fsS -X POST localhost:8080/v1/accounts -d '{"id":"rider","currency":"VND"}'
          curl -fsS -X POST localhost:8080/v1/transfers -H 'Idempotency-Key: ci-1' \
            -d '{"currency":"VND","from":"funding","to":"rider","amount":50000}'
          for i in $(seq 1 15); do
            docker compose --profile stack logs webhook-sink | grep -q '"msg":"event"' && exit 0
            sleep 2
          done
          docker compose --profile stack logs
          exit 1
      - name: Tear down
        if: always()
        run: docker compose --profile stack down -v
